<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistente de Priorização Inteligente</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Paleta Dark & Tech */
            --bg-app: #1a1b1e; /* Fundo principal */
            --bg-chat: #212226; /* Fundo da área de chat */
            --bg-message-user: #2d2e33; /* Bolha do usuário */
            --bg-message-ai: #212226; /* Fundo da resposta da IA (padrão ChatGPT) */
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --primary: #3b82f6; /* Azul Tech vibrante */
            --primary-hover: #60a5fa;
            --border-color: #34353a;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-app);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- Header Estilo App --- */
        header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-chat);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        header h1 {
            font-size: 18px;
            margin: 0;
            font-weight: 600;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        header h1::before {
            content: '✦'; /* Ícone tecnológico simples */
            color: var(--primary);
            font-size: 20px;
        }

        /* --- Container do Chat --- */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0 100px 0; /* Padding inferior para não cobrir com o input */
            display: flex;
            flex-direction: column;
            gap: 5px;
            scroll-behavior: smooth;
        }

        /* Centraliza o chat em telas grandes */
        @media (min-width: 768px) {
            #chat-container, header, .input-area {
                padding-left: calc(50% - 380px);
                padding-right: calc(50% - 380px);
            }
        }

        /* --- Estrutura das Mensagens --- */
        .message-row {
            display: flex;
            padding: 20px;
            gap: 15px;
            border-bottom: 1px solid transparent;
        }

        .message-row.user {
            background-color: transparent; /* Fundo limpo para o usuário */
        }

        .message-row.assistant {
            background-color: var(--bg-message-ai);
            border-color: var(--border-color);
        }

        /* Avatares */
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            flex-shrink: 0;
        }

        .user .avatar {
            background-color: #4f46e5; /* Roxo para usuário */
            color: white;
        }

        .assistant .avatar {
            background-color: var(--primary); /* Azul para IA */
            color: white;
        }

        /* Conteúdo da Mensagem */
        .message-content {
            flex: 1;
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap; /* Mantém a formatação do RAG */
        }

        /* --- Tela de Boas-vindas --- */
        #welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }

        #welcome-screen h2 {
            color: var(--text-main);
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        /* --- Área de Input Fixa (Estilo ChatGPT) --- */
        .input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(180deg, rgba(26,27,30,0) 0%, rgba(26,27,30,1) 50%);
            display: flex;
            justify-content: center;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
            max-width: 760px;
            background-color: var(--bg-message-user);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: border-color 0.3s;
        }

        .input-wrapper:focus-within {
            border-color: var(--primary);
        }

        textarea {
            width: 100%;
            padding: 16px 60px 16px 16px; /* Espaço para o botão */
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            resize: none;
            outline: none;
            box-sizing: border-box;
            max-height: 200px;
            overflow-y: auto;
        }

        /* Botão Enviar dentro do Input */
        #submitBtn {
            position: absolute;
            right: 10px;
            bottom: 10px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            width: 36px;
            height: 36px;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #submitBtn:hover {
            background-color: var(--primary-hover);
        }

        #submitBtn:disabled {
            background-color: var(--border-color);
            cursor: not-allowed;
            opacity: 0.5;
        }

    </style>
</head>
<body>

    <header>
        <h1>Assistente de Priorização</h1>
    </header>

    <div id="chat-container">
        <div id="welcome-screen">
            <h2>✦</h2>
            <p>Olá, Milena! Como posso organizar o seu dia hoje?</p>
            <p style="font-size: 13px; margin-top: 5px;">Peça para priorizar suas tarefas do Google.</p>
        </div>
        </div>

    <div class="input-area">
        <div class="input-wrapper">
            <textarea id="queryInput" rows="1" placeholder="Digite sua pergunta aqui..." oninput="autoResize(this)"></textarea>
            <button id="submitBtn" onclick="sendQuery()">⬆</button>
        </div>
    </div>

    <script>
        // Ajusta a altura do textarea automaticamente ao digitar
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = (textarea.scrollHeight) + 'px';
        }

        function addMessage(sender, text) {
            const chatContainer = document.getElementById('chat-container');
            const welcomeScreen = document.getElementById('welcome-screen');

            // Esconde a tela de boas vindas na primeira mensagem
            if (welcomeScreen) welcomeScreen.style.display = 'none';

            const messageRow = document.createElement('div');
            messageRow.className = `message-row ${sender}`;

            const avatarHTML = sender === 'user' 
                ? '<div class="avatar">M</div>' 
                : '<div class="avatar">IA</div>';

            messageRow.innerHTML = `
                ${avatarHTML}
                <div class="message-content">${text}</div>
            `;

            chatContainer.appendChild(messageRow);
            // Scroll automático para o final
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendQuery() {
            const queryInput = document.getElementById('queryInput');
            const submitBtn = document.getElementById('submitBtn');
            const query = queryInput.value;

            if (!query.trim()) return; // Não envia vazio

            // 1. Adiciona mensagem do usuário
            addMessage('user', query);
            
            // Limpa input e reseta altura
            queryInput.value = '';
            queryInput.style.height = 'auto';
            
            // Desabilita botão durante o processo
            submitBtn.disabled = true;
            submitBtn.innerText = '...';

            // 2. Adiciona mensagem de "pensando" da IA
            const tempAiMessageId = 'ai-loading-' + Date.now();
            addMessage('assistant', '<span style="color: var(--text-muted)">Consultando suas regras de negócio e agenda...</span>');
            
            try {
                // Configuração da sua API
                const apiGatewayUrl = 'http://localhost:8000';
                const response = await fetch(`${apiGatewayUrl}/prioritize`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });

                // Remove a mensagem de carregamento antes de colocar a real
                const chatContainer = document.getElementById('chat-container');
                chatContainer.removeChild(chatContainer.lastChild);

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || 'Erro ao processar.');
                }

                const data = await response.json();
                
                // 3. Adiciona a resposta real da IA (o texto formatado pelo RAG)
                addMessage('assistant', data.prioritized_response);

            } catch (error) {
                // Remove carregamento e mostra erro
                const chatContainer = document.getElementById('chat-container');
                chatContainer.removeChild(chatContainer.lastChild);
                addMessage('assistant', `❌ Erro: ${error.message}`);
            } finally {
                // Reabilita o botão
                submitBtn.disabled = false;
                submitBtn.innerText = '⬆';
            }
        }

        // Permite enviar com Enter (e Shift+Enter para quebrar linha)
        document.getElementById('queryInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendQuery();
            }
        });
    </script>
</body>
</html>
